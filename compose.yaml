name: geza
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: geza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: geza
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U geza -d geza]
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    build: .
    image: geza:local
    command: [node, --import, tsx, scripts/migrate.ts]
    env_file: .env
    environment:
      DATABASE_URL: postgres://geza:${POSTGRES_PASSWORD}@db:5432/geza
    depends_on:
      db: { condition: service_healthy }
  app:
    image: geza:local
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://geza:${POSTGRES_PASSWORD}@db:5432/geza
      HOSTNAME: 0.0.0.0
      PORT: 3080
    ports:
      - '127.0.0.1:${GEZA_PORT:-3080}:3080'
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    image: geza:local
    restart: unless-stopped
    command: [node, --import, tsx, scripts/worker.ts]
    env_file: .env
    environment:
      DATABASE_URL: postgres://geza:${POSTGRES_PASSWORD}@db:5432/geza
    volumes:
      - ./data:/imports:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  database:
